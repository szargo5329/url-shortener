name: Frontend CI

# Build + typecheck on every push/PR. Deploy to S3 + CloudFront only on push to
# main, via GitHub Actions OIDC federation (Section 14) — no static AWS credentials.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc -b && vite build` — typecheck and build in one
      # step, so a type error fails the job.
      - name: Typecheck and build
        run: npm run build

  deploy:
    name: Deploy frontend
    needs: build
    runs-on: ubuntu-latest
    # Only a push to main deploys — never dev, never pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Assume the deploy role via OIDC — short-lived credentials, no secret keys.
      # Same role as the backend deploy, extended with S3 + CloudFront permissions.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Vite builds in production mode here, so it picks up the committed
      # .env.production (real API Gateway URL) automatically.
      - name: Build production bundle
        run: npm run build

      # --delete prunes files removed from the build, matching the s3:DeleteObject
      # permission granted to this role.
      - name: Upload to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
